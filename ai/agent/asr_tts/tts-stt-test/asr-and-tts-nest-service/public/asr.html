<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASR 录音测试</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        line-height: 1.6;
      }
      button {
        margin-right: 8px;
        margin-bottom: 8px;
        padding: 8px 14px;
      }
      .status {
        margin: 12px 0;
        color: #444;
      }
      pre {
        background: #f6f8fa;
        padding: 12px;
        border-radius: 6px;
        white-space: pre-wrap;
      }
    </style>
</head>
<body>
    <h1>ASR 录音上传测试</h1>
    <p>点击开始录音，结束后自动上传到<code>/speech/asr</code>.</p>
    <button id="start-btn">开始录音</button>
    <button id="stop-btn">停止录音并停止录音</button>
    <div id="status">状态:未开始</div>
    <h3>识别结果</h3>
    <pre id="result">(暂无)</pre>
    <script>
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const statusEl = document.getElementById('status');
        const resultEl = document.getElementById('result');
        
        let mediaRecorder = null;//录音对象
        let chunks = [];
        const recordFilename = "record.ogg";//录音文件名 ogg格式

        function setStatus(text){
            statusEl.textContent = "状态：" + text;
        }

        startBtn.addEventListener('click', async() => {
            try{
                const stream = await navigator.mediaDevices.getUserMedia({video:true});
                chunks = [];//重置录音数据
                //指定音频类型 采用ogg格式，opus 编码 用于浏览器录音输出音频格式

                const preferredMimeType = 'audio/ogg;codecs=opus';
                mediaRecorder = MediaRecorder.isSupported(preferredMimeType)?
                new MediaRecorder(stream,{mimeType:preferredMimeType}):
                new MediaRecorder(stream);

                mediaRecorder.ondataavailable = (event)=>{
                    if(event.data && event.data.size > 0){
                        console.log(event.data);
                    }
                }
                mediaRecorder.onstop = async()=>{
                    setStatus("录音结束");
                    try{
                        console.log(chunks);
                    }catch(err){

                    }
                }
                mediaRecorder.start(250);
                setStatus("录音中");
            }catch(err){

            }
        });
    </script>
</body>
</html>
